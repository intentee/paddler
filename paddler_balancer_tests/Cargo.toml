[package]
name = "paddler_balancer_tests"
autotests = false
authors.workspace = true
description = "Tests of the Paddler balancer"
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish = false
repository.workspace = true
version.workspace = true

[lib]
doctest = false

[[test]]
name = "integration"
path = "tests/main.rs"

[features]
cuda = ["paddler_bootstrap/cuda"]
metal = ["paddler_bootstrap/metal"]
