paddler_cluster_harness = { workspace = true }
paddler_inference_parameters = { workspace = true }
paddler_messaging = { workspace = true }
serde_json = { workspace = true }
tokio-util = { workspace = true }

[dev-dependencies]
actix-web = { workspace = true }
indexmap = { workspace = true }
llama-cpp-bindings-types = { workspace = true }
nix = { workspace = true }
paddler_balancer = { workspace = true }
paddler_balancer_desired_state_fixture = { workspace = true }
paddler_balancer_state_database = { workspace = true }
paddler_bootstrap = { workspace = true }
paddler_model_card_fixture = { workspace = true }
paddler_model_source = { workspace = true }
paddler_request_params_fixture = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
trzcina = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = { workspace = true }
paddler_refused_syscalls = { workspace = true }
seccompiler = { workspace = true }

[lints]
workspace = true
