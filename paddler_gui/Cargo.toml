[package]
name = "paddler_gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Paddler desktop application"
homepage.workspace = true
license.workspace = true
publish = false
repository.workspace = true

[lib]
name = "paddler_gui"
path = "src/lib.rs"

[[bin]]
name = "paddler_gui"
path = "src/main.rs"

[dependencies]
async-stream = { workspace = true }
clap = { workspace = true }
command_handler = { workspace = true }
env_logger = { workspace = true }
iced = { workspace = true }
if-addrs = { workspace = true }
log = { workspace = true }
open = { workspace = true }
paddler_balancer = { workspace = true }
paddler_bootstrap = { workspace = true }
paddler_inference_parameters = { workspace = true }
paddler_messaging = { workspace = true }
paddler_state_database = { workspace = true }
statum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
trzcina = { workspace = true }

[dev-dependencies]
paddler_test_cluster_harness = { workspace = true }

[lints]
workspace = true

[features]
default = []
cuda = ["paddler_bootstrap/cuda"]
metal = ["paddler_bootstrap/metal"]
vulkan = ["paddler_bootstrap/vulkan"]
web_admin_panel = [
    "paddler_balancer/web_admin_panel",
    "paddler_bootstrap/web_admin_panel",
]
