[workspace]
members = [
    "paddler_agent",
    "paddler_agent_status",
    "paddler_balancer",
    "paddler_bootstrap",
    "paddler_cache_dir",
    "paddler_cli",
    "paddler_cli_tests",
    "paddler_client",
    "paddler_download_manager",
    "paddler_gui",
    "paddler_gui_tests",
    "paddler_image_decoder",
    "paddler_inference_parameters",
    "paddler_local_http_fixture",
    "paddler_messaging",
    "paddler_model_source",
    "paddler_openai_response_format_validator",
    "paddler_opencode_tests",
    "paddler_request_registry",
    "paddler_state_database",
    "paddler_test_cluster_harness",
    "paddler_tests",
    "paddler_tool_call_validator",
]
resolver = "2"

[workspace.package]
authors = ["Intentee"]
description = "Open-source LLMOps platform for hosting and scaling AI in your own infrastructure"
edition = "2024"
homepage = "https://paddler.intentee.com/"
license = "Apache-2.0"
repository = "https://github.com/intentee/paddler"
version = "4.1.0"

[workspace.dependencies]
actix-cors = "0.7"
actix-rt = "2.11"
actix-web = "4.13"
actix-web-lab = "0.26"
actix-ws = "0.3"
anyhow = { version = "1.0", features = ["backtrace"] }
askama = "0.14"
async-openai = { version = "0.40", features = ["byot", "chat-completion", "responses"] }
async-stream = "0.3"
async-trait = "0.1"
bytes = "1.11"
cadence = "1.6"
clap = { version = "4.5", features = ["derive", "string"] }
command_handler = "0.1"
dashmap = "6.1"
data-url = "0.3"
encoding_rs = { version = "0.8", features = ["serde"] }
env_logger = "0.11"
esbuild-metafile = "0.5"
fslock = "0.2"
futures = "0.3"
futures-util = { version = "0.3", features = ["tokio-io"] }
headers = "0.4"
hf-hub = { version = "0.4", features = ["tokio"] }
http = "1.4"
httparse = "1.10"
image = "0.25"
indoc = "2.0"
jsonschema = { version = "0.37", default-features = false }
llama-cpp-bindings = "0.16"
llama-cpp-bindings-sys = "0.16"
llama-cpp-bindings-types = "0.16"
base64 = "0.22"
log = "0.4"
mime_guess = "2.0"
minijinja = { version = "2.12", features = ["builtins", "json", "loader"] }
minijinja-contrib = { version = "2.12", features = ["datetime", "pycompat", "wordcount", "wordwrap"] }
nanoid = "0.4"
nix = { version = "0.30", features = ["resource", "signal"] }
open = "5.3"
parking_lot = "0.12"
quick-xml = "0.39"
rand = "0.9"
reqwest = { version = "0.12", features = ["json", "stream"] }
resvg = "0.46"
rust-embed = { version = "8.9", features = ["interpolate-folder-path"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
shellexpand = "3.1"
socket2 = "0.6"
iced = { version = "0.14", features = ["image", "svg", "tokio"] }
iced_test = { version = "0.14" }
if-addrs = "0.13"
statum = "0.6"
tempfile = "3.20"
tokio = { version = "1.48", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-test = "0.4"
tokio-tungstenite = "0.28"
tokio-util = { version = "0.7", features = ["rt"] }
thiserror = "2.0"
trzcina = "0.3"
url = { version = "2.5", features = ["serde"] }
yaml-rust2 = "0.11"
paddler_agent = { version = "4.1", path = "paddler_agent" }
paddler_agent_status = { version = "4.1", path = "paddler_agent_status" }
paddler_balancer = { version = "4.1", path = "paddler_balancer" }
paddler_bootstrap = { version = "4.1", path = "paddler_bootstrap" }
paddler_cache_dir = { version = "4.1", path = "paddler_cache_dir" }
paddler_cli = { version = "4.1", path = "paddler_cli" }
paddler_client = { version = "4.1", path = "paddler_client" }
paddler_download_manager = { version = "4.1", path = "paddler_download_manager" }
paddler_gui = { version = "4.1", path = "paddler_gui" }
paddler_image_decoder = { version = "4.1", path = "paddler_image_decoder" }
paddler_inference_parameters = { version = "4.1", path = "paddler_inference_parameters" }
paddler_local_http_fixture = { version = "4.1", path = "paddler_local_http_fixture" }
paddler_messaging = { version = "4.1", path = "paddler_messaging" }
paddler_model_source = { version = "4.1", path = "paddler_model_source" }
paddler_openai_response_format_validator = { version = "4.1", path = "paddler_openai_response_format_validator" }
paddler_request_registry = { version = "4.1", path = "paddler_request_registry" }
paddler_state_database = { version = "4.1", path = "paddler_state_database" }
paddler_test_cluster_harness = { version = "4.1", path = "paddler_test_cluster_harness" }
paddler_tests = { version = "4.1", path = "paddler_tests" }
paddler_tool_call_validator = { version = "4.1", path = "paddler_tool_call_validator" }

[profile.release]
lto = true
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Lint groups (priority = -1 so individual overrides take precedence)
all = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# Specific linter settings
absolute_paths = "deny"
allow_attributes = "deny"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
dbg_macro = "deny"
error_impl_error = "allow"
expect_used = "deny"
future_not_send = "allow"
infinite_loop = "deny"
literal_string_with_formatting_args = "allow"
missing_docs_in_private_items = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
needless_pass_by_value = "allow"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
rc_mutex = "deny"
rest_pat_in_fully_bound_structs = "deny"
self_named_module_files = "deny"
significant_drop_tightening = "allow"
str_to_string = "deny"
# integration tests live in tests/*.rs which is already compiled test-only by Cargo;
# wrapping every file in `#[cfg(test)] mod tests { }` would be redundant.
tests_outside_test_module = "allow"
todo = "deny"
too_many_lines = "allow"
unimplemented = "deny"
unwrap_used = "deny"

