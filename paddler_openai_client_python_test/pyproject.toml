[tool.poetry]
name = "paddler-openai-client-python-test"
version = "5.0.0"
description = "Drives Paddler's OpenAI-compatible endpoints with the OpenAI client to verify real-client compatibility"
authors = ["Intentee"]
license = "Apache-2.0"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
openai = "==3.37.0"

[tool.poetry.group.dev.dependencies]
pytest = "9.1.1"
pyright = "1.1.414"
mypy = "2.4.0"

[tool.mypy]
python_version = "3.11"
strict = true
extra_checks = true

[tool.pyright]
pythonVersion = "3.11"
pythonPlatform = "All"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
