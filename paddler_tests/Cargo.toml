[package]
name = "paddler_tests"
autotests = false
authors.workspace = true
description = "In-process integration tests for Paddler"
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish = false
repository.workspace = true
version.workspace = true

[[bin]]
name = "run_with_test_cluster"
path = "src/bin/run_with_test_cluster.rs"

[[test]]
name = "integration"
path = "tests/main.rs"

[features]
default = []
cuda = ["paddler_bootstrap/cuda"]
metal = ["paddler_bootstrap/metal"]
tests_that_use_llms = []
web_admin_panel = ["paddler_balancer/web_admin_panel", "paddler_bootstrap/web_admin_panel"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
futures-util = { workspace = true }
log = { workspace = true }
paddler_agent = { workspace = true }
paddler_agent_decision = { workspace = true }
paddler_agent_embeddings = { workspace = true }
paddler_agent_runtime = { workspace = true }
paddler_agent_status = { workspace = true }
paddler_agent_text_generation = { workspace = true }
paddler_balancer = { workspace = true }
paddler_bootstrap = { workspace = true }
paddler_client = { workspace = true }
paddler_inference_parameters = { workspace = true }
paddler_messaging = { workspace = true }
paddler_openai_response_format_validator = { workspace = true }
paddler_state_database = { workspace = true }
paddler_test_cluster_harness = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }

[dev-dependencies]
async-openai = { workspace = true }
hf-hub = { workspace = true }
http = { workspace = true }
llama-cpp-bindings = { workspace = true }
llama-cpp-bindings-types = { workspace = true }
paddler_local_http_fixture = { workspace = true }
tokio-tungstenite = { workspace = true }

[lints]
workspace = true
