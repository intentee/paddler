[package]
name = "paddler_cli_tests"
autotests = false
authors.workspace = true
description = "Subprocess-isolated multi-agent integration tests for Paddler"
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish = false
repository.workspace = true
version.workspace = true

[[bin]]
name = "paddler_cluster_node"
path = "src/bin/paddler_cluster_node.rs"

[[test]]
name = "integration"
path = "tests/main.rs"

[features]
default = []
cuda = ["paddler_cli/cuda"]
metal = ["paddler_cli/metal"]
tests_that_use_llms = []
web_admin_panel = ["paddler_cli/web_admin_panel", "paddler_tests/web_admin_panel"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
nix = { workspace = true }
paddler_balancer = { workspace = true }
paddler_cli = { workspace = true }
paddler_inference_parameters = { workspace = true }
paddler_messaging = { workspace = true }
paddler_test_cluster_harness = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }

[dev-dependencies]
actix-web = { workspace = true }
llama-cpp-bindings = { workspace = true }
paddler_agent_text_generation = { workspace = true }
paddler_bootstrap = { workspace = true }
paddler_client = { workspace = true }
paddler_openai_response_format_validator = { workspace = true }
paddler_tests = { workspace = true }
reqwest = { workspace = true }
tempfile = { workspace = true }
tokio-tungstenite = { workspace = true }
trzcina = { workspace = true }
url = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = { workspace = true }
seccompiler = { workspace = true }

[lints]
workspace = true
