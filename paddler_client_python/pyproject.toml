[tool.poetry]
name = "paddler-client"
version = "4.0.1"
description = "Python client for Paddler LLM load balancer"
authors = ["Intentee"]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/intentee/paddler"
repository = "https://github.com/intentee/paddler"
keywords = ["llm", "load-balancer", "inference", "paddler"]
classifiers = [
    "Typing :: Typed",
    "Framework :: Pydantic :: 2",
]
packages = [{include = "paddler_client"}]

[tool.poetry.dependencies]
python = "^3.11"
httpx = "^0.28"
websockets = "^15"
pydantic = "^2"

[tool.poetry.group.dev.dependencies]
paddler-test-cluster = { path = "../paddler_test_cluster_python", develop = true }
pytest = "9.0.3"
pytest-asyncio = "1.3.0"
pytest-cov = "7.1.0"
pygments = "2.20.0"
pyright = "1.1.408"
ruff = "0.15.12"
mypy = "1.19.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.11"
strict = true
extra_checks = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.pyright]
pythonVersion = "3.11"
pythonPlatform = "All"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",  # Any type allowed for JSON data
    "COM812",  # trailing comma - conflicts with formatter
    "D",       # docstrings - project prefers self-documenting code
    "FBT",     # boolean arguments - standard for pydantic models and config
    "ISC001",  # implicit string concatenation - conflicts with formatter
    "S105",    # false positive on enum member names like TOKEN
    "TRY003",  # long exception messages - fine for ValueError with context
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "PERF401", # async for with append - clearer than comprehension in tests
    "PLR2004", # magic values in assertions
    "S101",    # assert statements
    "S106",    # false positive on token keyword argument
    "SIM117",  # nested with statements - async with can't combine easily
]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.coverage.run]
branch = true
source = ["paddler_client", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov-report=term-missing"
