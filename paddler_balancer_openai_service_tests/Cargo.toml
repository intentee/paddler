[package]
name = "paddler_balancer_openai_service_tests"
autotests = false
authors.workspace = true
description = "Tests of the OpenAI-compatible API of the Paddler balancer"
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish = false
repository.workspace = true
version.workspace = true

[lib]
doctest = false

[[bin]]
name = "opencode_stub"
path = "src/bin/opencode_stub.rs"

[[test]]
name = "integration"
path = "tests/main.rs"

[features]
cuda = ["paddler_cluster_harness/cuda"]
metal = ["paddler_cluster_harness/metal"]
tests_that_use_llms = []
tests_that_use_opencode = []

[dependencies]
anyhow = { workspace = true }
futures-util = { workspace = true }
paddler_cluster_harness = { workspace = true }
paddler_messaging = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }

[dev-dependencies]
async-openai = { workspace = true }
http = { workspace = true }
paddler_balancer_openai_service = { workspace = true }
paddler_client = { workspace = true }
paddler_model_card_fixture = { workspace = true }
paddler_openai_schema_validator = { workspace = true }
paddler_request_params_fixture = { workspace = true }
reqwest = { workspace = true }
tokio-util = { workspace = true }

[lints]
workspace = true
