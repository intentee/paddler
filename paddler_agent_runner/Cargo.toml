[package]
name = "paddler_agent_runner"
autotests = false
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Runs a Paddler agent's services until it is cancelled"
homepage.workspace = true
license.workspace = true
repository.workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
nanoid = { workspace = true }
paddler_agent = { workspace = true }
paddler_agent_runtime = { workspace = true }
paddler_agent_status = { workspace = true }
paddler_messaging = { workspace = true }
paddler_service_thread = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
trzcina = { workspace = true }

[dev-dependencies]
paddler_test_cluster_harness = { workspace = true }

[lints]
workspace = true

[features]
default = []
cuda = ["paddler_agent/cuda"]
metal = ["paddler_agent/metal"]
vulkan = ["paddler_agent/vulkan"]
