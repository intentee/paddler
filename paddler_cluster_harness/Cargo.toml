[package]
name = "paddler_cluster_harness"
autotests = false
authors.workspace = true
description = "Starts and drives Paddler clusters for tests"
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish = false
repository.workspace = true
version.workspace = true

[lib]
doctest = false

[[bin]]
name = "run_with_test_cluster"
path = "src/bin/run_with_test_cluster.rs"

[[test]]
name = "integration"
path = "tests/main.rs"

[features]
cuda = ["paddler_bootstrap/cuda"]
metal = ["paddler_bootstrap/metal"]
tests_that_use_llms = []
web_admin_panel = ["paddler_bootstrap/web_admin_panel"]

[dependencies]
anyhow = { workspace = true }
async-openai = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
futures-util = { workspace = true }
log = { workspace = true }
paddler_balancer = { workspace = true }
paddler_balancer_desired_state_fixture = { workspace = true }
paddler_balancer_state_database = { workspace = true }
paddler_balancer_typesafe_service = { workspace = true }
paddler_bootstrap = { workspace = true }
paddler_cache_dir = { workspace = true }
paddler_client = { workspace = true }
paddler_download_manager = { workspace = true }
paddler_inference_parameters = { workspace = true }
paddler_local_http_fixture = { workspace = true }
paddler_messaging = { workspace = true }
paddler_model_card_fixture = { workspace = true }
paddler_model_source = { workspace = true }
paddler_spawn_resuming_panic = { workspace = true }
quick-xml = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
trzcina = { workspace = true }
url = { workspace = true }

[dev-dependencies]
paddler_file_fixture = { workspace = true }

[lints]
workspace = true
