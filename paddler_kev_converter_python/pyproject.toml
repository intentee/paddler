[tool.poetry]
name = "paddler-kev-converter"
version = "5.0.0"
description = "Converts kev decision checkpoints into the files Paddler serves, and writes the reference fixtures Paddler's decision tests use"
authors = ["Intentee"]
license = "Apache-2.0"
packages = [{include = "paddler_kev_converter"}]

[tool.poetry.scripts]
paddler-kev-converter = "paddler_kev_converter.command_line:main"

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
gguf = { git = "https://github.com/ggml-org/llama.cpp.git", rev = "3f03b17724ad8b69040825f45c43c59b092a0244", subdirectory = "gguf-py" }
huggingface-hub = "==2.3.0"
kev = { git = "https://github.com/jaredpalmer/kev.git", rev = "2074cc44256200bb37540103fa4572901faa10f3" }
numpy = "==2.5.4"
peft = "==0.21.2"
torch = [
    { version = "==2.8.0+cpu", source = "pytorch-cpu", markers = "sys_platform == 'linux'" },
    { version = "==2.8.0", source = "PyPI", markers = "sys_platform == 'darwin'" },
]
transformers = "==5.20.2"

[tool.poetry.group.dev.dependencies]
pytest = "9.1.1"
pytest-cov = "7.1.0"
mypy = "2.4.0"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.12"
strict = true
extra_checks = true
mypy_path = "stubs"

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.coverage.run]
branch = true
source = ["paddler_kev_converter", "tests"]

[tool.pytest.ini_options]
addopts = "--cov-report=term-missing"
tmp_path_retention_policy = "failed"
