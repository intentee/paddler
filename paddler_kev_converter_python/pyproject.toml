[tool.poetry]
name = "paddler-kev-converter"
version = "5.0.0"
description = "Converts kev decision checkpoints into the files Paddler serves, and writes the reference fixtures Paddler's decision tests use"
authors = ["Intentee"]
license = "Apache-2.0"
packages = [{include = "paddler_kev_converter"}]

[tool.poetry.scripts]
paddler-kev-converter = "paddler_kev_converter.command_line:main"

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
gguf = { git = "https://github.com/ggml-org/llama.cpp.git", rev = "5266f24da75dc449bd56cbed7addb9c8e4a6a73e", subdirectory = "gguf-py" }
huggingface-hub = "==1.32.0"
kev = { git = "https://github.com/jaredpalmer/kev.git", rev = "fe64b1274ea7f80d4095866df90666abb03e9cf6" }
numpy = "==2.5.3"
peft = "==0.21.0"
torch = [
    { version = "==2.8.0+cpu", source = "pytorch-cpu", markers = "sys_platform == 'linux'" },
    { version = "==2.8.0", source = "PyPI", markers = "sys_platform == 'darwin'" },
]
transformers = "==5.17.0"

[tool.poetry.group.dev.dependencies]
pytest = "9.0.3"
pytest-cov = "7.1.0"
ruff = "0.15.12"
mypy = "1.19.1"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.12"
strict = true
extra_checks = true
mypy_path = "stubs"


[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # trailing comma - conflicts with formatter
    "D",       # docstrings - project prefers self-documenting code
    "ISC001",  # implicit string concatenation - conflicts with formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "PLR2004", # magic values in assertions
    "S101",    # assert statements
]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.coverage.run]
branch = true
source = ["paddler_kev_converter", "tests"]

[tool.pytest.ini_options]
addopts = "--cov-report=term-missing"
tmp_path_retention_policy = "failed"
