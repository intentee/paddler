[tool.poetry]
name = "paddler-test-cluster"
version = "4.0.1"
description = "Spawns real Paddler balancers and agents for the Python test suites"
authors = ["Intentee"]
license = "Apache-2.0"
packages = [{include = "paddler_test_cluster"}]

[tool.poetry.dependencies]
python = "^3.11"
paddler-client = { path = "../paddler_client_python", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "9.0.3"
pytest-asyncio = "1.3.0"
pytest-cov = "7.1.0"
pyright = "1.1.408"
ruff = "0.15.12"
mypy = "1.19.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.11"
strict = true
extra_checks = true
plugins = ["pydantic.mypy"]

[tool.pyright]
pythonVersion = "3.11"
pythonPlatform = "All"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # trailing comma - conflicts with formatter
    "D",       # docstrings - project prefers self-documenting code
    "ISC001",  # implicit string concatenation - conflicts with formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert statements
]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.coverage.run]
branch = true
source = ["paddler_test_cluster", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov-report=term-missing"
