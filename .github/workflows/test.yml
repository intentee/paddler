name: test

on:
  pull_request:
    branches:
      - "**"
    types:
      - edited
      - opened
      - ready_for_review
      - review_requested
      - synchronize
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.137

      - name: Run unit tests
        run: make test.unit

  javascript:
    name: javascript
    needs: paddler-binary
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Download the Paddler binary
        uses: actions/download-artifact@v4
        with:
          name: paddler-binary
          path: target/debug

      - name: Mark the downloaded Paddler binary as built and executable
        run: |
          chmod +x target/debug/paddler
          touch target/debug/paddler

      - name: Run JS client tests
        run: make test.client.js

  paddler-binary:
    name: paddler binary
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - uses: Swatinem/rust-cache@v2

      - name: Build the Paddler binary
        run: make target/debug/paddler

      - name: Upload the Paddler binary
        uses: actions/upload-artifact@v4
        with:
          name: paddler-binary
          path: target/debug/paddler

  python:
    name: python (${{ matrix.python-version }})
    needs: paddler-binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pip install poetry==2.4.3

      - name: Download the Paddler binary
        uses: actions/download-artifact@v4
        with:
          name: paddler-binary
          path: target/debug

      - name: Mark the downloaded Paddler binary as built and executable
        run: |
          chmod +x target/debug/paddler
          touch target/debug/paddler

      - name: Lint the Python client
        run: make lint.client.python

      - name: Lint the OpenAI Python client suite
        run: make lint.openai.python

      - name: Run Python client tests
        run: make test.client.python
