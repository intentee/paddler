[package]
name = "paddler_bootstrap"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Starts and runs the Paddler balancer and agent services"
homepage.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
actix-web = { workspace = true }
log = { workspace = true }
nanoid = { workspace = true }
paddler_agent = { workspace = true }
paddler_agent_runtime = { workspace = true }
paddler_balancer = { workspace = true }
paddler_balancer_openai_service = { workspace = true }
paddler_balancer_state_database = { workspace = true }
paddler_balancer_typesafe_service = { workspace = true }
paddler_error_chain = { workspace = true }
paddler_messaging = { workspace = true }
paddler_model_source = { workspace = true }
paddler_outbox = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
trzcina = { workspace = true }

[dev-dependencies]
paddler_capturing_logger = { workspace = true }
paddler_cluster_harness = { workspace = true }

[lints]
workspace = true

[features]
default = []
cuda = ["paddler_agent/cuda"]
metal = ["paddler_agent/metal"]
vulkan = ["paddler_agent/vulkan"]
web_admin_panel = ["paddler_balancer/web_admin_panel"]
