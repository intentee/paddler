[package]
name = "paddler_agent_text_generation_tests"
autotests = false
authors.workspace = true
description = "Tests of the Paddler agent text generation pipeline"
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish = false
repository.workspace = true
version.workspace = true

[lib]
doctest = false

[[test]]
name = "integration"
path = "tests/main.rs"

[features]
cuda = ["paddler_cluster_harness/cuda"]
metal = ["paddler_cluster_harness/metal"]
tests_that_use_llms = []

[dependencies]
anyhow = { workspace = true }
llama-cpp-bindings-sys = { workspace = true }
llama-cpp-bindings-types = { workspace = true }
llama-cpp-chat = { workspace = true }
llama-cpp-context = { workspace = true }
llama-cpp-fault-injection = { workspace = true }
llama-cpp-model = { workspace = true }
llama-cpp-sampler = { workspace = true }
log = { workspace = true }
paddler_agent_model_capabilities = { workspace = true }
paddler_agent_pipeline_harness = { workspace = true }
paddler_agent_runtime = { workspace = true }
paddler_agent_text_generation = { workspace = true }
paddler_balancer_desired_state_fixture = { workspace = true }
paddler_cluster_harness = { workspace = true }
paddler_file_fixture = { workspace = true }
paddler_inference_parameters = { workspace = true }
paddler_messaging = { workspace = true }
paddler_model_card_fixture = { workspace = true }
paddler_model_source = { workspace = true }
paddler_openai_translation = { workspace = true }
paddler_request_params_fixture = { workspace = true }
paddler_tool_call_validator = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
futures-util = { workspace = true }
llama-cpp-token-usage = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }
paddler_refused_syscalls = { workspace = true }
seccompiler = { workspace = true }

[lints]
workspace = true
